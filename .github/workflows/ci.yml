name: CI

on:
  # Pushes of branches only: a pushed tag starts the release workflow, which runs this gate itself.
  push:
    branches: ['**']
  pull_request:
  # The release workflow runs this same gate before it publishes. A called workflow sees only the
  # secrets it is handed, and the release hands over the Codecov token alone.
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

# A newer push to the same branch or pull request makes the run in progress pointless. On main every
# commit is checked to the end, so that a failure there names the commit that brought it. Called by
# the release workflow, github.workflow names the caller, so that run has a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The prepare script installs the Git hooks, which a CI checkout has no use for.
  HUSKY: '0'

jobs:
  verify:
    name: Verify (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Reads the version from the packageManager field of package.json. It comes before
      # setup-node, whose pnpm cache asks pnpm where its store is.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # A run of a tag is the gate of a release, and its tarball is what npm publishes, so it
      # restores no store from the cache: every dependency comes from the registry, checked against
      # the lockfile. Pushes of branches and pull requests keep the cache. The automatic cache of
      # setup-node, which turns on only for a project whose package manager is npm, is off on a tag
      # as well.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: ${{ !startsWith(github.ref, 'refs/tags/') && 'pnpm' || '' }}
          package-manager-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      # The stdio tests start packages/server/dist/cli.js and refuse a bundle that is older than the
      # sources, so the build comes before the tests, and dist is never restored from a cache.
      - name: Build
        run: pnpm build

      # The tarball npm would publish, packed from the build above. pnpm runs the prepack script,
      # which adds the README, the LICENSE and the CHANGELOG.
      - name: Pack the package
        run: pnpm --filter tradingview-desktop-mcp pack --pack-destination "$RUNNER_TEMP/package"

      # What a user installs must hold the bundle, its types, the dashboard and the documents, and
      # nothing else: only package.json, README.md, LICENSE, CHANGELOG.md and dist/ at the top, and
      # no source map anywhere.
      - name: Check the contents of the tarball
        run: |
          tarball=$(find "$RUNNER_TEMP/package" -name '*.tgz')
          listing=$(tar -tzf "$tarball")
          echo "$listing"
          status=0
          for path in package/dist/cli.js package/dist/index.js package/dist/index.d.ts \
            package/dist/dashboard/index.html package/README.md package/LICENSE package/CHANGELOG.md; do
            if ! grep -qxF "$path" <<< "$listing"; then
              echo "::error::The tarball lacks $path."
              status=1
            fi
          done
          while IFS= read -r path; do
            case "$path" in
              *.map)
                echo "::error::The tarball must not contain the source map $path."
                status=1
                ;;
              package/ | package/package.json | package/README.md | package/LICENSE | \
                package/CHANGELOG.md | package/dist/*) ;;
              *)
                echo "::error::The tarball must not contain $path: only package.json, README.md, LICENSE, CHANGELOG.md and dist/ belong in it."
                status=1
                ;;
            esac
          done <<< "$listing"
          exit "$status"

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      # Runs both levels again, now measured, and fails when any metric is under 80%.
      - name: Coverage gate
        run: pnpm test:coverage

      # Also after a failed gate, because the report shows what is not covered.
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/server/coverage
          if-no-files-found: ignore
          retention-days: 7

      # What the next job installs, so that it tests the package that passed here. It comes before
      # the Codecov upload, so that a slow or stuck upload cannot hold it back.
      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

      # Feeds the badge and never fails the run: the gate above decides, and a stuck upload is cut
      # off after five minutes. The token is optional for pull requests from forks, which cannot
      # read secrets.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('packages/server/coverage/lcov.info') != '' }}
        continue-on-error: true
        timeout-minutes: 5
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/server/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false

  runtime-node20:
    name: Runtime (Node 20)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # For the smoke script alone, which imports nothing from the repository. Nothing is installed
      # here, so the checkout has no node_modules that the package could lean on.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: ${{ runner.temp }}/package

      # 20.19.0 is the oldest Node that engines.node of the package accepts.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          package-manager-cache: false

      # Installs the tarball the way a user gets it: into an empty directory outside the checkout,
      # with its runtime dependencies resolved from their version ranges by npm 10, which comes
      # with Node 20.
      # - The package.json of its own keeps npm from installing into a parent directory.
      # - --ignore-scripts keeps install scripts of dependencies from running; none is needed.
      - name: Install the package into an empty directory
        run: |
          tarball=$(find "$RUNNER_TEMP/package" -name '*.tgz')
          mkdir "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          echo '{ "private": true }' > package.json
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund "$tarball"

      # The bin itself, the way npx starts it: through its shebang, which needs the exec bit.
      - name: Run the installed bin
        env:
          SMOKE_CLI: ${{ runner.temp }}/app/node_modules/.bin/tradingview-desktop-mcp
        run: |
          expected=$(node -p "require('./packages/server/package.json').version")
          printed=$("$SMOKE_CLI" --version)
          if [ "$printed" != "$expected" ]; then
            echo "::error::The installed bin printed '$printed' for --version, not $expected."
            exit 1
          fi
          echo "tradingview-desktop-mcp --version: $printed"

      - name: Smoke test the installed CLI
        env:
          SMOKE_CLI: ${{ runner.temp }}/app/node_modules/.bin/tradingview-desktop-mcp
        run: |
          node --version
          node scripts/smoke-node20.mjs

  # The dashboard in Chromium, twice: against the mock server of its end-to-end tests (the built page
  # with synthetic answers), and against the built server as it ships, which talks to the fake
  # TradingView of the server's tests. Never against a real TradingView.
  dashboard-e2e:
    name: Dashboard E2E (Chromium)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The mock server serves the built page, and the real project starts the built CLI, which
      # carries its own copy of the page. The build comes from these sources, never from a cache.
      - name: Build
        id: build
        run: pnpm build

      # Chromium alone, with the system libraries it needs.
      - name: Install Chromium
        id: chromium
        run: pnpm --filter tradingview-desktop-mcp-dashboard exec playwright install --with-deps chromium

      # Each project writes its report to a folder of its own, so that the second run keeps the first
      # one's.
      - name: End-to-end tests (mocked)
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/mocked
        run: pnpm --filter tradingview-desktop-mcp-dashboard test:e2e

      # Also after a failed mocked run, so that one failure does not hide the other. TV_E2E stays
      # unset: the server talks to the fake TradingView, which the project starts itself.
      - name: End-to-end tests (real server, fake TradingView)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/real
        run: pnpm --filter tradingview-desktop-mcp-dashboard test:e2e:real

      # With the trace and the screenshot of each failed test, for both projects.
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/dashboard/playwright-report
          if-no-files-found: ignore
          retention-days: 7
